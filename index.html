<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PK XD PORTAL — Посты и новости</title>
  <meta name="description" content="Посты и новости PK XD PORTAL" />

  <meta property="og:title" content="PK XD PORTAL — Посты и новости" />
  <meta property="og:description" content="Новости, события, посты и обновления PK XD PORTAL" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pkxdportal.github.io/pkxd-portal-posts/" />
  <meta property="og:image" content="https://pkxdportal.github.io/pkxd-portal-posts/assets/portal-badge.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-bg"></div>

  <div class="container">
    <header class="hero">
      <div class="hero-top">
        <div class="hero-title-wrap">
          <img
            src="assets/portal-badge.png"
            alt="Portal"
            class="hero-icon"
          />
          <div>
            <h1>PK XD PORTAL</h1>
            <p class="subtitle">Посты и новости</p>
          </div>
        </div>

        <div class="owner-actions">
          <button id="loginBtn" class="owner-btn" onclick="login()">Вход для владельцев</button>
          <button id="logoutBtn" class="owner-btn hidden" onclick="logout()">Выйти</button>
        </div>
      </div>

      <div class="toolbar">
        <input
          id="searchInput"
          type="text"
          placeholder="Поиск по постам..."
          class="search-input"
        />

        <select id="categoryFilter" class="filter-select">
          <option value="all">Все категории</option>
        </select>
      </div>
    </header>

    <main>
      <section id="pinnedSection" class="section hidden">
        <h2 class="section-title">Закреплённые</h2>
        <div id="pinnedList" class="post-list"></div>
      </section>

      <section class="section">
        <h2 class="section-title">Все посты</h2>
        <div id="postList" class="post-list"></div>
      </section>
    </main>
  </div>

  <script>
    let allPosts = [];

    function parseDate(dateStr) {
      if (!dateStr || typeof dateStr !== "string" || !dateStr.includes(".")) {
        return new Date(0);
      }

      const [d, m, y] = dateStr.split(".");
      return new Date(`${y}-${m}-${d}`);
    }

    function sortPosts(posts) {
      return [...posts].sort((a, b) => {
        const aPinned = Boolean(a?.pinned);
        const bPinned = Boolean(b?.pinned);

        if (aPinned !== bPinned) {
          return bPinned - aPinned;
        }

        return parseDate(b?.date) - parseDate(a?.date);
      });
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function normalizePost(post) {
      return {
        title: post?.title || "Без названия",
        slug: post?.slug || "",
        date: post?.date || "",
        author: post?.author || "@pkxd_portal",
        description: post?.description || "",
        category: post?.category || "Общее",
        pinned: Boolean(post?.pinned)
      };
    }

    function renderCard(post) {
      const safePost = normalizePost(post);

      return `
        <a class="post-card" href="posts/${encodeURIComponent(safePost.slug)}.html">
          <div class="post-card-top">
            <div class="tag-row">
              <span class="tag">${escapeHtml(safePost.category)}</span>
              ${safePost.pinned ? `<span class="tag pin-tag">Закреплено</span>` : ""}
            </div>
          </div>
          <h3>${escapeHtml(safePost.title)}</h3>
          <div class="meta">Автор: ${escapeHtml(safePost.author)} · ${escapeHtml(safePost.date)}</div>
          <p>${escapeHtml(safePost.description)}</p>
        </a>
      `;
    }

    function renderPosts() {
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const category = document.getElementById("categoryFilter").value;

      const filtered = sortPosts(allPosts).filter((rawPost) => {
        const post = normalizePost(rawPost);

        const title = post.title.toLowerCase();
        const description = post.description.toLowerCase();
        const postCategory = post.category.toLowerCase();

        const matchSearch =
          title.includes(search) ||
          description.includes(search) ||
          postCategory.includes(search);

        const matchCategory =
          category === "all" || post.category === category;

        return matchSearch && matchCategory;
      });

      const pinned = filtered.filter(post => post.pinned);
      const regular = filtered.filter(post => !post.pinned);

      const pinnedSection = document.getElementById("pinnedSection");
      const pinnedList = document.getElementById("pinnedList");
      const postList = document.getElementById("postList");

      pinnedList.innerHTML = pinned.map(renderCard).join("");
      postList.innerHTML = regular.map(renderCard).join("");

      if (pinned.length > 0) {
        pinnedSection.classList.remove("hidden");
      } else {
        pinnedSection.classList.add("hidden");
      }

      if (regular.length === 0 && pinned.length === 0) {
        postList.innerHTML = `<div class="empty-state">Ничего не найдено.</div>`;
      }
    }

    function fillCategories(posts) {
      const select = document.getElementById("categoryFilter");
      select.innerHTML = `<option value="all">Все категории</option>`;

      const categories = [
        ...new Set(posts.map(post => normalizePost(post).category))
      ].sort((a, b) => a.localeCompare(b, "ru"));

      for (const cat of categories) {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
      }
    }

    function login() {
      window.location.href = "https://YOUR-WORKER.workers.dev/login";
    }

    function logout() {
      localStorage.removeItem("gh_token");
      localStorage.removeItem("gh_login");
      document.body.classList.remove("admin");
      updateAuthUI();
      location.reload();
    }

    function updateAuthUI() {
      const token = localStorage.getItem("gh_token");
      const login = localStorage.getItem("gh_login");

      const loginBtn = document.getElementById("loginBtn");
      const logoutBtn = document.getElementById("logoutBtn");

      if (token && login === "pkxdportal") {
        document.body.classList.add("admin");
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
      } else {
        document.body.classList.remove("admin");
        loginBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
      }
    }

    async function loadPosts() {
      try {
        const response = await fetch(`posts.json?t=${Date.now()}`, {
          method: "GET",
          cache: "no-store",
          headers: {
            "Cache-Control": "no-cache"
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("posts.json должен быть массивом");
        }

        allPosts = data.map(normalizePost);

        fillCategories(allPosts);
        renderPosts();
      } catch (e) {
        document.getElementById("pinnedSection").classList.add("hidden");
        document.getElementById("postList").innerHTML =
          `<div class="empty-state">Не удалось загрузить посты.</div>`;
        console.error("Ошибка загрузки posts.json:", e);
      }
    }

    document.getElementById("searchInput").addEventListener("input", renderPosts);
    document.getElementById("categoryFilter").addEventListener("change", renderPosts);

    updateAuthUI();
    loadPosts();
  </script>
</body>
</html>
